name: Publish to MCP Registry

# Publishes server.json to the official MCP registry as com.fahaliai/fahali.
# The signing key lives only in GitHub Actions Secrets (encrypted, never in
# chat or source). Rotate it any time from the repo settings.
#
# ONE-TIME SETUP:
#   1. The registry namespace com.fahaliai is verified by the DNS TXT on
#      fahaliai.com apex: `v=MCPv1; k=ed25519; p=<base64-public-key>`.
#   2. Put the matching ed25519 PRIVATE key (hex) in:
#        repo -> Settings -> Secrets and variables -> Actions -> New secret
#        Name: MCP_DNS_KEY
#      It MUST match the public key currently in the DNS TXT record. If the key
#      was lost, generate a new pair, update the DNS TXT to the new public key,
#      wait for propagation, then store the new private key here.
#
# THEN publish by cutting a GitHub Release (or run this workflow manually).
# Bump server.json + package.json version first (the registry rejects
# re-publishing an existing version).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL \
            https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            -o mcp-publisher.tar.gz
          tar xzf mcp-publisher.tar.gz
          chmod +x mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Login (DNS) and publish
        env:
          MCP_DNS_KEY: ${{ secrets.MCP_DNS_KEY }}
        run: |
          if [ -z "$MCP_DNS_KEY" ]; then
            echo "::error::MCP_DNS_KEY secret is not set. See the setup notes at the top of this workflow."
            exit 1
          fi
          ./mcp-publisher login dns --domain fahaliai.com --private-key "$MCP_DNS_KEY"
          ./mcp-publisher publish
