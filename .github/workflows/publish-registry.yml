name: Publish to MCP Registry

# Publishes server.json to the official MCP registry as com.fahaliai/fahali.
# Domain verification for fahaliai.com is active via:
#   1. HTTP: https://fahaliai.com/.well-known/mcp-registry-auth
#   2. DNS TXT: v=MCPv1; k=ed25519; p=...
# Authentication keys are stored in GitHub Secrets (MCP_REGISTRY_KEY / MCP_DNS_KEY).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL \
            https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            -o mcp-publisher.tar.gz
          tar xzf mcp-publisher.tar.gz
          chmod +x mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Login and publish
        env:
          MCP_DNS_KEY: ${{ secrets.MCP_DNS_KEY }}
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
        run: |
          KEY="${MCP_REGISTRY_KEY:-$MCP_DNS_KEY}"
          if [ -z "$KEY" ]; then
            echo "::error::Neither MCP_REGISTRY_KEY nor MCP_DNS_KEY secret is set."
            exit 1
          fi
          echo "Authenticating via HTTP domain verification on fahaliai.com..."
          if ./mcp-publisher login http --domain fahaliai.com --private-key "$KEY"; then
            echo "HTTP domain authentication succeeded."
          else
            echo "HTTP failed, falling back to DNS authentication..."
            ./mcp-publisher login dns --domain fahaliai.com --private-key "$KEY"
          fi
          ./mcp-publisher publish
