name: Publish fahali-mcp to npm

# Secret-free publishing via npm Trusted Publishing (OIDC, npm >= 11.5).
# No NPM_TOKEN stored: GitHub mints a short-lived OIDC token that npm trusts,
# and the publish is provenance-signed. Nothing to leak or rotate.
#
# ONE-TIME SETUP (no secret):
#   npmjs.com -> the `fahali-mcp` package -> Settings -> Trusted Publisher ->
#   add GitHub Actions:
#     Organization/User: Future-Legends-Inc
#     Repository:        fahali-mcp
#     Workflow:          publish-npm.yml
#     Environment:       (leave blank)
#   Note: npm requires the package to EXIST before a trusted publisher can be
#   attached. For the very first publish of this new name, do ONE manual
#   `npm publish` (npm login in your own terminal), then configure the trusted
#   publisher above so every later release is token-free.
#
# THEN publish by cutting a GitHub Release (or run this workflow manually).
# Bump package.json version first — npm rejects re-publishing a version.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC trusted publishing; no NPM_TOKEN needed
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest
      - name: Install + build
        run: |
          npm ci
          npm run build
      - name: Publish (provenance, OIDC)
        run: npm publish --provenance --access public
